       後方卡片 → 白色外框、內部透空，讓照片透出來（原為白底深灰框）
       前方卡片 → 實心白（原為實心深灰）
       $ 符號 → 用 mask 從白卡「挖空」，而非填白，否則會與卡片融成一塊
