<!-- 兩大核心服務 01：財務碳健檢
     置於深色照片遮罩上（.core-card 為 rgba(8,28,21,.62~.9) 底、白字），
     故整組線條為純白。文件底色不可留 fill="white" —— 白底配白線會糊成
     一塊，改為透空讓照片透出來（同 icon-02 後方卡片的處理）。

     文件為 150x150 正方：icon-02 是橫式，原稿 130x173 的直式文件並排
     會一高一扁。改方後整體外框約 171x176，接近正方，與 icon-02 的
     82x61 橫式在視覺份量上相當。

     版面約束（改動內部元素時務必維持）：
       - 三列列距 30，第三列不畫線條 —— 該處由放大鏡佔據
       - 第二列線條下緣 82.5，鏡片上緣 87，兩者不可交疊
       - 鏡片右緣 158、下緣 163，需留在文件內緣 165.2 之內
       - 鏡柄刻意穿出文件右下角，是此圖示的識別特徵

     viewBox 統一為以 (64,64) 為中心、邊長 84 的正方畫布：
     兩張圖示共用同一畫布，方框才會重合、上下緣對得齊。
     外框 stroke-width 寫 9.52 而非 4 —— 整組已被 scale(.42) 縮過，
     9.52 x .42 = 4，換算後才與 icon-02 的方框同粗 -->
<svg width="84" height="84" viewBox="22 22 84 84" fill="none" xmlns="http://www.w3.org/2000/svg">
<g transform="translate(21.72 20.67) scale(0.42)">

<!-- 報告文件外框（正方、透空） -->
<rect x="20" y="20" width="150" height="150" fill="none" stroke="#FFFFFF" stroke-width="9.52"/>

<!-- 勾選項目：三列，列距 30 -->
<path d="M36 50.5L42.67 58.5L56 41.5" stroke="#FFFFFF" stroke-width="8"/>
<path d="M36 80.5L42.67 88.5L56 71.5" stroke="#FFFFFF" stroke-width="8"/>
<path d="M36 110.5L42.67 118.5L56 101.5" stroke="#FFFFFF" stroke-width="8"/>

<!-- 條目文字：前兩列有線，第三列留給放大鏡 -->
<path d="M71 50H99" stroke="#FFFFFF" stroke-width="5"/>
<path d="M108 50H155" stroke="#FFFFFF" stroke-width="5"/>
<path d="M71 80H147" stroke="#FFFFFF" stroke-width="5"/>

<!-- 放大鏡 -->
<circle cx="120" cy="125" r="34" stroke="#FFFFFF" stroke-width="8"/>
<path d="M144 149L181.5 186.5" stroke="#FFFFFF" stroke-width="13"/>

