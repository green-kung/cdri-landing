<!-- 補助與輔導資源 02：免費節能、減碳輔導
     原檔的白色底方塊與圓形底塊皆已移除，只留插畫本身。
     （註解中不可寫出 CSS 變數的兩個減號前綴，XML 註解禁止連續減號）

     viewBox 收緊至插畫實際邊界，否則四周留白會讓圖畫得偏小。
     邊界取自 getBBox() 的 132,225 1048.4x759，再加上 softShadow
     的擴散（stdDeviation 12、dy 12 → 左右各 30、上 18、下 42），
     得 102,207 1110x819，長寬比 1.355。

     此比例即兩張圖共用的基準：icon-01 的插畫較方（1.164），
     於該檔左右補白至同比例，兩張並排高度才會齊平 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="819" viewBox="102 207 1110 819" role="img" aria-label="輔導 icon">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#f7fbec"/>
      <stop offset="100%" stop-color="#eef5dd"/>
    </radialGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a9d95f"/>
      <stop offset="60%" stop-color="#72b52f"/>
      <stop offset="100%" stop-color="#4c921d"/>
    </linearGradient>
    <linearGradient id="green2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b9e16d"/>
      <stop offset="70%" stop-color="#6eaf2e"/>
      <stop offset="100%" stop-color="#3f8618"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd84d"/>
      <stop offset="58%" stop-color="#f6c144"/>
      <stop offset="100%" stop-color="#d9a11a"/>
    </linearGradient>
    <linearGradient id="white3d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f5f0df"/>
      <stop offset="100%" stop-color="#dfd7bd"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#56751f" flood-opacity="0.22"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#3b4b19" flood-opacity="0.23"/>
    </filter>
    <clipPath id="leafClip">
      <path d="M884 700 C969 650 1090 659 1180 665 C1185 776 1132 872 1041 927 C982 962 923 962 875 941 C842 885 829 770 884 700 Z"/>
    </clipPath>
  </defs>


  <!-- person -->
  <g filter="url(#softShadow)">
    <circle cx="376" cy="443" r="148" fill="url(#green)"/>
    <path d="M132 947 C135 753 220 609 376 609 C530 609 615 753 618 947 C619 968 603 984 581 984 L169 984 C147 984 131 968 132 947 Z" fill="url(#green)"/>
    <path d="M312 594 C337 625 413 625 440 594 C431 647 400 680 376 690 C351 680 321 647 312 594 Z" fill="url(#white3d)"/>
    <circle cx="376" cy="644" r="41" fill="url(#white3d)" filter="url(#smallShadow)"/>
    <path d="M352 680 L400 680 L433 839 C436 852 432 865 422 874 L389 905 C381 913 369 913 361 905 L328 874 C318 865 314 852 317 839 Z" fill="url(#white3d)" filter="url(#smallShadow)"/>
  </g>

  <!-- clipboard -->
  <g filter="url(#softShadow)">
    <rect x="602" y="336" width="447" height="622" rx="40" fill="url(#yellow)"/>
    <rect x="644" y="370" width="363" height="540" rx="28" fill="url(#white3d)"/>
    <path d="M792 293 C792 253 824 225 862 225 C901 225 932 253 932 293 L902 293 C902 271 886 254 862 254 C839 254 822 271 822 293 Z" fill="url(#yellow)"/>
    <rect x="725" y="289" width="273" height="104" rx="24" fill="url(#yellow)" filter="url(#smallShadow)"/>

    <g fill="none" stroke="url(#green2)" stroke-linecap="round" stroke-linejoin="round" stroke-width="33">
      <path d="M718 506 L754 542 L812 474"/>
      <path d="M718 649 L754 685 L812 617"/>
      <path d="M718 792 L754 828 L812 760"/>
    </g>
    <g stroke="url(#green2)" stroke-linecap="round" stroke-width="34">
      <line x1="856" y1="512" x2="978" y2="512"/>
      <line x1="856" y1="655" x2="978" y2="655"/>
    </g>
  </g>

  <!-- leaf -->
  <g filter="url(#softShadow)">
    <path d="M884 700 C969 650 1090 659 1180 665 C1185 776 1132 872 1041 927 C982 962 923 962 875 941 C842 885 829 770 884 700 Z" fill="url(#green2)"/>
    <g clip-path="url(#leafClip)">
      <path d="M883 938 C963 838 1039 764 1152 699" fill="none" stroke="#3f8618" stroke-width="16" stroke-linecap="round" opacity="0.85"/>
      <path d="M871 945 C954 848 1028 776 1139 713" fill="none" stroke="#b6df68" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
    </g>
    <path d="M884 700 C969 650 1090 659 1180 665 C1185 776 1132 872 1041 927 C982 962 923 962 875 941 C842 885 829 770 884 700 Z" fill="none" stroke="#5da324" stroke-width="4" opacity="0.35"/>
  </g>
</svg>
